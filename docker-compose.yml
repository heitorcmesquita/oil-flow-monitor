version: '3.8'

# Minimal docker-compose for development utilities only.
# NOTE: Kafka itself is expected to be available at localhost:9092 (per project constraints).
services:
  kafka-ui:
    image: provectuslabs/kafka-ui:latest
    container_name: kafka-ui
    ports:
      - "8080:8080"
    environment:
      # Connect to the local Kafka broker running on the host
      KAFKA_CLUSTERS_0_NAME: local
      KAFKA_CLUSTERS_0_BOOTSTRAPSERVERS: localhost:9092
    restart: unless-stopped

